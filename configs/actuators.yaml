# Derating scenarios for the "sustained" check when rated torque is unknown or
# untrusted: sustained_cap = factor * stall_torque.
derating_scenarios: {optimistic: 0.5, nominal: 0.33, conservative: 0.25}

# Joint -> servo assignment sets. `baseline` is what the model is built with.
assignments:
  baseline:          # Feetech, single protocol; 2S (7.4 V) main rail + 6 V buck for STS3032.
                     # Chosen over the 12 V C018 after the Gate B audit: C018 knee speed (4.7 rad/s)
                     # limits swing to ~1 step/s; C046 reaches 2 steps/s with knee peak ~72% stall.
    hip_yaw: STS3032_6V
    hip_roll: STS3215_C046_7V4
    hip_pitch: STS3215_C046_7V4
    knee: STS3215_C046_7V4
    ankle: STS3032_6V
  torque_feetech_12v:  # same case, 345:1: 2x torque, 0.43x speed (12 V rail) -- speed-limited
    hip_yaw: STS3032_6V
    hip_roll: STS3215_C018_12V
    hip_pitch: STS3215_C018_12V
    knee: STS3215_C018_12V
    ankle: STS3032_6V
  slim_dynamixel:    # smallest envelope, over budget
    hip_yaw: XL330_M288_5V
    hip_roll: XC330_T288_11V1
    hip_pitch: XC330_T288_11V1
    knee: XC330_T288_11V1
    ankle: XL330_M288_5V
  xl330_only:        # cheapest/slimmest - expected to fail torque audit; kept as an explicit negative check
    hip_yaw: XL330_M288_5V
    hip_roll: XL330_M288_5V
    hip_pitch: XL330_M288_5V
    knee: XL330_M288_5V
    ankle: XL330_M288_5V

# Servo-internal controller approximation (hardware calibration needed).
servo_model:
  kp_duty_per_rad: 8.0       # PWM duty per rad of position error (full duty at ~7 deg error)
  kd_duty_per_radps: 0.05
  current_limit_frac: 1.0    # fraction of stall current allowed by firmware
  frictionloss: 0.03         # N*m, gearbox Coulomb friction (estimate)
  armature_fallback: 0.002   # kg*m^2, used only if a servo has no rotor_inertia / gear ratio
  deadband_rad: 0.0015       # ~1 encoder tick x 4
  backlash_rad: 0.0          # 0 in deterministic baseline; randomized later (0.5-1.5 deg)
  latency_s: 0.004           # bus round-trip + firmware (estimate @1 Mbps, 10 servos)
  target_slew_radps: 8.0
