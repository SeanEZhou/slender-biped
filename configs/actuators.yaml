# Actuator catalog + joint assignment.
#
# All torques in N*m, speeds in rad/s, masses in kg, dimensions in m.
# Envelope convention: L = long body dimension (perpendicular to shaft, output shaft
# sits near one end of L), W = short body dimension, H = dimension along the output
# shaft axis (case only; horn/bracket added separately via `horn_clearance`).
#
# torque-speed model (see slender_biped/actuator.py): linear DC motor curve
#   tau = tau_stall * (u - omega/omega_noload),  u = PWM duty in [-1, 1]
# "rated" = vendor rated/continuous torque if documented, else null (UNKNOWN).
# `spec_confidence`: official = manufacturer datasheet/e-manual; vendor = retailer
# listings only (no official datasheet located); estimate = our assumption.
# Prices are planning numbers observed 2026-10, NOT live quotes.

