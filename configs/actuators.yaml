    noload_speed: 4.72        # 0.222 s/60deg
    stall_current: 2.7
    noload_current: 0.18
    gear_ratio: 345
    rotor_inertia: 2.5e-8    # kg*m^2 ESTIMATE (no datasheet value); armature = J_rotor * N^2
    mass: 0.055
    dims: {L: 0.0452, W: 0.0247, H: 0.035}
