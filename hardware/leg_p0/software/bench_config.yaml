# Bench bring-up configuration for the P0 leg. Edit after calibration (assembly.md steps 5 and 7).
port: /dev/ttyACM0          # Windows: COM3 etc.
baudrate: 1000000           # STS3215 factory default (1 Mbps)
speed_counts_per_s: 250     # ~22 deg/s; keep low for first tests (4096 counts = 360 deg)
acceleration: 20            # 0-254 (x100 counts/s^2); low = gentle starts

# Joint -> servo ID and calibration. center = encoder count at the CAD neutral pose (straight leg);
# direction = +1 if increasing counts moves the joint in its positive direction (see README "sign
# conventions"), else -1. Limits (deg, relative to neutral) are 5 deg inside the CAD collision-free range.
joints:
  hip_yaw:   {id: 1, center: 2048, direction: 1, min_deg: -15, max_deg: 25}   # 2026-10-27: zeroed square in P03 (offset 2002), direction verified (+ = left), 10x +-15 deg sweep OK
  hip_roll:  {id: 2, center: 2048, direction: -1, min_deg: -10, max_deg: 25}   # 2026-10-27: zeroed square in P03/P04 (offset -1993), direction verified (+ = abduction, counts reversed), 3x +-10 deg OK
  hip_pitch: {id: 3, center: 2048, direction: 1, min_deg: -25, max_deg: 80}   # 2026-10-28: zeroed straight; sweeps and routines run clean, + = flexion NOT yet explicitly confirmed
  knee:      {id: 4, center: 2048, direction: -1, min_deg: 0,   max_deg: 105}   # 2026-10-29: zeroed straight (offset -2005); servo counts run opposite to +knee (flexion)
